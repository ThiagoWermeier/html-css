<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>parágrafos e quebras de linha</h1>
    <hr>
    <p>Você pode escrever um parágrafo de qualquer jeito.
        só precisa colocar tudo dentro do par de tags &lt;p&gt; e &lt;/p&gt;. <!--Menor que / greather than-->
    </p>
    <p>Se eu precisar quebrar a linha, <br>posso usar a tag &lt;br&gt;.</p>
    <p>Vamos adicionar alguns símbolos especiais:
        &reg;
        &copy;
        &trade;
        &euro;
        &pound;
        &yen;
        &sect;
        &para;
    </p>
    <p>agora vamos para os emoji:</p>
        &#x1F600; <!--😀-->
</body>
</html>
