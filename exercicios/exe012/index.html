<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor</p>
        <video width="500" poster="imagens/limoes-capa.png" controls autoplay loop>
            <source src="midia/meu_video.mp4" type="video/mp4">
            <source src="midia/novo.mov.mov" type="video/mov">
            <source src="midia/novo.webm.webm" type="video/webm">
            <source src="midia/novo.mkv.mkv" type="video/mkv">
            <source src="midia/videocurto.mp4.mp4" type="video/mp4">
                <p>Seu navegador não é compativel para exibir vídeos. Clique <a href="midia/meu_video.mp4"> aqui</a>para baixar o vídeo.</p>
        </video>

    <h1>Inserindo vídeos do YouTube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/qg8MQVH1TYA?si=PnNzICVe7ZIbA77E" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
