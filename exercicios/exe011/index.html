<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mídias em navegador</title>
</head>
<body>
    <h1>Imagens dinamicas</h1>
    <p>Tente abrir esse site em diferentes dispositivos</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/imagem-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/imagem-m.png" type="image/png">
        <img src="imagens/imagem-g.png" alt="imagem-grande">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Aqui um exemplo de áudio</p>
        <audio preload="metadata" controls>
        <source src="midia/happy-mistake.mp3" type="audio/mpeg">
        <source src="midia/happy-mistake.mp3" type="audio/ogg">
        <source src="midia/happy-mistake.mp3" type="audio/wav">        
        <p>Infelizmente o seu navegador não consegue reproduzir áudios. Clique <a href="midia/happy-mistake.mp3"> aqui</a> para fazer download do arquivo</p>
   </audio>
</body>
</html>
