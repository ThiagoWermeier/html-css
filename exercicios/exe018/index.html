<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes com Google Fonts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        @import url('https://fonts.googleapis.com/css2?family=Anta&family=Press+Start+2P&display=swap');

        body {
            font-family: "Press Start 2P", system-ui;
            font-weight: 400;
            font-style: normal;
            color: black;
        }
        h1 {
            font-family: "Press Start 2P", system-ui;
            font-weight: 400;
            font-style: normal;
            color: black;
            font-size: 3em;
        }

        p {
            font-family: "Anta", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Magnam corporis placeat sint quo rem doloremque eligendi debitis aperiam sit architecto quod dicta sapiente amet, eius optio fuga molestias dignissimos quidem.</p>
</body>
</html>
